<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список продуктов по категории</title>
</head>
<body>
    <h1>Продукты в категории</h1>
    {% if products %}
        <ul>
            {% for product in products %}
                <li>
                    <strong>{{ product.name }}</strong><br>
                    Цена: {{ product.price }}<br>
                    Описание: {{ product.description }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>В данной категории пока нет продуктов.</p>
    {% endif %}
</body>
</html>
